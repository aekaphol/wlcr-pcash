<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f97316"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="WL-Cash CR"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="favicon.png"><link rel="manifest" href="manifest.webmanifest">
<title>WL-Cash | ใบเบิกเงินสดย่อย เวียงหลวง เชียงราย</title>
<style>
:root{--o:#f97316;--od:#ea580c;--bg:#fff7ed;--b:#fed7aa;--t:#1f2937;--m:#6b7280;--g:#16a34a;--bl:#2563eb;--r:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.5 "Noto Sans Thai","Sarabun",system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:100px}
header{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px}
.hd{display:flex;gap:10px;align-items:center}.hd img{border-radius:9px}.hd h1{margin:0;font-size:19px;line-height:1.1}.hd small{opacity:.92}
.bd{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.dt{position:relative;background:#fff;color:var(--od);border-radius:99px;padding:6px 14px;font-weight:700;margin:0}.dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;padding:0}
.pill{background:#fff3;border-radius:99px;padding:5px 11px;font-size:13px}
.tabs{display:flex;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--b)}
.tabs button{flex:1;border:0;background:none;padding:13px 4px;font:inherit;font-size:15px;color:var(--m);border-bottom:3px solid transparent}
.tabs button.on{color:var(--od);border-color:var(--o);font-weight:700}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
h2 i{font-style:normal;background:var(--o);color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
input,select{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--b);border-radius:12px;font:inherit;background:#fff}
input:focus{outline:2px solid var(--o);border-color:var(--o)}input:disabled{background:#f3f4f6}
.ro{min-height:46px;display:flex;align-items:center;justify-content:flex-end;padding:9px 12px;border-radius:12px;background:#f3f4f6;font-weight:700;font-size:18px}
.gp{display:flex;justify-content:space-between;align-items:center;background:#f0fdf4;border:1.5px solid #86efac;border-radius:14px;padding:10px 12px;margin-top:10px}
.gp.neg{background:#fef2f2;border-color:#fca5a5}.gp b{font-size:20px;color:var(--g)}.gp.neg b{color:var(--r)}.gp span{font-size:13px;color:var(--m);display:block}
.pct{font-size:13px;font-weight:700;border-radius:99px;padding:2px 9px;background:#dcfce7;color:var(--g);white-space:nowrap}.pct.neg{background:#fee2e2;color:var(--r)}
.vl{border:1.5px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}.vl:active{background:var(--bg)}
.vl .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.vl .t b{font-size:16px}.vl .t small{color:var(--m);font-weight:400;margin-left:6px}
.vl .sa{display:flex;justify-content:space-between;font-size:17px;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--b)}
.vl dl{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:8px 0 0;font-size:14px}.vl dt{color:var(--m)}.vl dd{margin:0;text-align:right;font-weight:600}
.vl .gl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--b);font-weight:700}
.vl .gl em{font-style:normal;color:var(--g)}.vl .gl em.neg{color:var(--r)}
.xl{font-size:24px;font-weight:700;text-align:right}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}
button{font:inherit;cursor:pointer}
button.p,button.s,button.d{min-height:48px;padding:10px 16px;border-radius:14px;border:0;font-weight:700}
button.p{background:var(--o);color:#fff}button.s{background:#fff;border:1.5px solid var(--o);color:var(--od)}button.d{background:#fee2e2;color:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button{border:1.5px solid var(--b);background:#fff7ed;border-radius:12px;padding:9px 12px;font-size:15px;min-height:44px}
.chips button.has{background:#dcfce7;border-color:#86efac;color:#166534}
.add{width:100%;min-height:48px;border:2px dashed var(--o);background:#fff;color:var(--od);border-radius:14px;font-weight:700}
.hint{font-size:13px;color:var(--m);margin:4px 0}.empty{color:var(--m);padding:12px 0;text-align:center}
.it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--b)}.it b{flex:1;font-weight:600}.it small{color:var(--m);display:block;font-weight:400}.it span{font-weight:700}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.big{font-weight:700;font-size:18px;color:var(--od);border-top:2px solid var(--b);margin-top:6px;padding-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--b)}th:first-child,td:first-child{text-align:left}
table.tl td:nth-child(2),table.tl th:nth-child(2),table.tl td:last-child,table.tl th:last-child{text-align:left}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;overflow-x:auto;padding-bottom:4px}.day{display:flex;gap:2px;align-items:flex-end;height:100%;min-width:34px}
.day div{width:14px}.stk{display:flex;flex-direction:column-reverse}.lg span{margin-right:10px;font-size:12px}
.ok{background:#dcfce7;color:var(--g);padding:10px 12px;border-radius:12px;margin-bottom:12px;font-weight:700}.ok a{text-decoration:underline;margin-left:6px;color:var(--r)}
.seg{display:flex;gap:8px}.seg button{flex:1;min-height:46px;border:1.5px solid var(--b);background:#fff;border-radius:12px}.seg button.on{background:var(--o);color:#fff;border-color:var(--o);font-weight:700}
.sheet{position:fixed;inset:0;background:#0006;z-index:15;display:flex;align-items:flex-end}.sheet[hidden]{display:none}
.box{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.box h3{margin:0 0 4px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--b);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:6}
#bar[hidden]{display:none}#bar div{flex:1}#bar small{display:block;color:var(--m);font-size:12px;line-height:1.2}#bar b{font-size:20px;color:var(--od)}#bar button{flex:1.3}
#pin{position:fixed;inset:0;background:var(--o);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:12px}
#pin .k{display:grid;grid-template-columns:repeat(3,72px);gap:10px}#pin .k button{height:60px;border-radius:50%;border:0;font-size:22px;background:#fff3;color:#fff}
#dots{font-size:28px;letter-spacing:8px;min-height:40px}
</style></head><body>
<div id="pin"><img src="icon-192.png" alt="" width="96" height="96" style="border-radius:20px"><h1 style="margin:0">WL-Cash</h1><div id="branchP"></div><div>กรุณาใส่รหัสผ่านเพื่อเข้าใช้งาน</div><div id="dots"></div><div class="k" id="kp"></div></div>
<header><div class="hd"><img src="icon-192.png" width="36" height="36" alt=""><div><h1>WL-Cash</h1><small id="branch"></small></div></div>
<div class="bd"><label class="dt">📅 <span id="dtx"></span><input type="date" id="date"></label><span class="pill" id="st"></span><span class="pill" id="mode"></span></div></header>
<nav class="tabs"><button data-t="petty">💵 เงินสดย่อย</button><button data-t="main">🥩 วัตถุดิบหลัก</button><button data-t="sum">📊 สรุป</button></nav>
<main id="main"></main><div class="sheet" id="sheet" hidden></div><div id="bar" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== ตั้งค่าสาขา: แก้ตรงนี้ ===== */
const CONFIG={
  branch:'เวียงหลวง สาขาเมืองเชียงราย',
  pin:'2551',
  defaults:{petty:["บรรจง เฮ่งดี", "แว๊กเกอร์", "ลัคกี้ เลย์", "ส้มโอ", "แจ่มจันทร์ผักสด", "สมชายซีฟู้ด", "ห้องเย็นมหาชัยเชียงราย", "มานนา", "โชคมงคล", "ผักป้าหรี", "เบนซ์นิก แตงโม", "ไข่ไก่", "กำไรเงิน888", "วิชดาอาหารทะเลแห้ง", "Makro", "ธนพิริยะ", "เก่งการค้า", "เชียงรายโปรเบค", "หวังเบเกอรี่"],main:["แกะกุ้งซิ่ง", "BJC", "ปุ้ย แม่กลอง", "ลัคกี้เลย์", "แพประกายโรจน์", "JP เจ๊ปู", "แพกฤษฎา (เจ๊ป้อม)", "SK เนื้อ", "ลูกชิ้น", "แก๊ส", "ถ่าน", "วอลล์", "น้ำแข็ง", "โค้ก", "อ๋าวิสกี้", "เสริมสุข"]},
  prefix:'cr',           // คำนำหน้า collection ของสาขานี้ (ใช้แยกข้อมูล)
  firebase:{
    apiKey:"AIzaSyC43leZ2mqeo05YACOfJRcaMKoz9mEAP3g",
    authDomain:"wlcr-pcash.firebaseapp.com",
    projectId:"wlcr-pcash",
    storageBucket:"wlcr-pcash.firebasestorage.app",
    messagingSenderId:"42601474410",
    appId:"1:42601474410:web:3e5e6652cb65dacba21d13",
    measurementId:"G-KJ1SJK9LP7"
  }
};
const $=s=>document.querySelector(s),fmt=n=>{n=+n||0;return (n<0?'-':'')+'฿'+Math.abs(n).toLocaleString('th-TH')},esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let db=null,mode='local',docs={},names={petty:[],main:[]},date=today(),tab='petty',from=today().slice(0,8)+'01',to=today();
const allN=t=>[...new Set([...(CONFIG.defaults[t]||[]),...names[t]])];
const LK=CONFIG.prefix+'_wlcash';

/* ===== ฐานข้อมูล ===== */
function init(){
  if(CONFIG.firebase.projectId){
    try{firebase.initializeApp(CONFIG.firebase);db=firebase.firestore();mode='cloud';
      db.collection(CONFIG.prefix+'_vouchers').onSnapshot(s=>{s.docChanges().forEach(c=>{if(c.type=='removed')delete docs[c.doc.id];else docs[c.doc.id]=c.doc.data()});render()});
      db.doc(CONFIG.prefix+'_meta/names').onSnapshot(s=>{if(s.exists)names=Object.assign({petty:[],main:[]},s.data());render()});
    }catch(e){console.error(e);db=null;mode='local'}
  }
  if(!db){try{const s=JSON.parse(localStorage.getItem(LK)||'{}');docs=s.docs||{};names=s.names||names}catch(e){}}
  render();
}
function persist(id){
  if(db){db.collection(CONFIG.prefix+'_vouchers').doc(id).set(docs[id]);db.doc(CONFIG.prefix+'_meta/names').set(names)}
  else try{localStorage.setItem(LK,JSON.stringify({docs,names}))}catch(e){}
}

/* ===== คำนวณ ===== */
const cur=()=>docs[date]||(docs[date]={date,sales:0,open:null,extra:0,items:[],ok:false});
const calc=d=>{let cash=0,card=0,main=0;d.items.forEach(i=>{if(i.t=='main')main+=+i.v;else if(i.p=='card')card+=+i.v;else cash+=+i.v});return{cash,card,main}};
const prevOf=dt=>{const k=Object.keys(docs).filter(x=>x<dt&&docs[x].ok).sort();return k.length?docs[k.pop()]:null};
const openOf=d=>{const pv=prevOf(d.date);return pv?closeOf(pv):(+d.open||0)};
const closeOf=d=>openOf(d)+(+d.extra||0)-calc(d).cash;

/* ===== หน้าจอ ===== */
let review=false,sh=null;
const billTxt=x=>(x.t=='main'||!x.b)?'':(x.b=='ไม่มี'?'ไม่มีบิล':x.b=='มี'?'🧾 มีบิล':'บิล '+x.b);
const TH=dt=>{const[y,m,d]=dt.split('-');return +d+' '+'ม.ค.,ก.พ.,มี.ค.,เม.ย.,พ.ค.,มิ.ย.,ก.ค.,ส.ค.,ก.ย.,ต.ค.,พ.ย.,ธ.ค.'.split(',')[m-1]+' '+(+y+543)};
function render(){
  const d=cur();
  $('#branch').textContent=CONFIG.branch;$('#mode').textContent=mode=='cloud'?'☁️ ซิงค์':'📴 เครื่องเดียว';
  $('#st').textContent=d.ok?'✅ บันทึกแล้ว':'🖊️ ฉบับร่าง';$('#dtx').textContent=TH(date);$('#date').value=date;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
  $('#main').innerHTML=tab=='sum'?summary():review?reviewV():voucher();
  bar();
}
function voucher(){
  const d=cur(),L=d.ok,c=calc(d),t=tab,dis=L?'disabled':'',o=openOf(d),ex=+d.extra||0,pv=prevOf(d.date);
  const rows=d.items.map((x,i)=>({x,i})).filter(z=>(z.x.t||'petty')==t);
  const sum={};rows.forEach(z=>sum[z.x.n]=(sum[z.x.n]||0)+ +z.x.v);
  let h=L?'<div class="ok">✅ ยืนยันบันทึกแล้ว <a onclick="unlock()">ยกเลิกยืนยันเพื่อแก้ไข</a></div>':'';
  if(t=='petty')h+=`<section class="card"><h2>💰 ยอดขายประจำวัน</h2><label>ยอดขายวันนี้ (บาท)</label><input class="xl" type="number" inputmode="decimal" placeholder="0" ${dis} value="${d.sales||''}" onchange="setF('sales',this.value)"></section>
  <section class="card"><h2><i>1</i>ยอดเงินตั้งต้น</h2><div class="row"><div><label>ยอดคงเหลือเงินสดเมื่อวาน</label>${pv?`<div class="ro">${fmt(o)}</div>`:`<input type="number" inputmode="decimal" placeholder="0" ${dis} value="${d.open||''}" onchange="setF('open',this.value)">`}</div><div><label>เบิกเพิ่ม (บาท)</label><input type="number" inputmode="decimal" placeholder="0" ${dis} value="${ex||''}" onchange="setF('extra',this.value)"></div></div><div class="tot big"><span>รวมเป็นเงินทั้งหมด</span><span>${fmt(o+ex)}</span></div><p class="hint">${pv?`ดึงจากยอดคงเหลือของใบล่าสุดที่ยืนยันแล้ว (${TH(pv.date)}) แก้ไขเองไม่ได้`:'ยังไม่มีใบก่อนหน้า กรอกยอดเริ่มต้นได้เฉพาะครั้งแรก'}</p></section>`;
  h+=`<section class="card"><h2>${t=='petty'?'<i>2</i>รายการเบิกจ่าย':'🥩 รายการวัตถุดิบหลัก'}</h2>`;
  if(!L)h+=`<p class="hint">แตะ${t=='petty'?'รายการ':'วัตถุดิบ'}เพื่อเพิ่มรายการอย่างรวดเร็ว</p><div class="chips">${allN(t).map((n,k)=>`<button class="${sum[n]?'has':''}" onclick="openSheet(${k})">${sum[n]?'✓ ':''}${esc(n)}</button>`).join('')}</div><button class="add" onclick="openSheet(-1)">+ เพิ่มรายการ / วัตถุดิบใหม่</button><p class="hint">พิมพ์ชื่อใหม่ได้เลย ระบบจะจำไว้ให้เลือกใช้ในวันถัดไปโดยอัตโนมัติ</p>`;
  h+=rows.length?rows.map(({x,i})=>`<div class="it" ${L?'':`onclick="openSheet(-1,${i})"`}><b>${esc(x.n)}<small>${t=='petty'?(x.p=='card'?'💳 บัตร':'💵 เงินสด')+(billTxt(x)?' · '+esc(billTxt(x)):''):''}${x.note?' · '+esc(x.note):''}</small></b><span>${fmt(x.v)}</span></div>`).join(''):'<div class="empty">ยังไม่มีรายการ</div>';
  h+='</section>';
  h+=t=='petty'?`<section class="card"><h2><i>3</i>สรุปยอดปัจจุบัน</h2><div class="tot"><span>เงินสด</span><span>${fmt(c.cash)}</span></div><div class="tot"><span>บัตร</span><span>${fmt(c.card)}</span></div><div class="tot"><span>รวมทั้งหมด</span><span>${fmt(c.cash+c.card)}</span></div><div class="tot big"><span>คงเหลือเงินสด</span><span>${fmt(closeOf(d))}</span></div></section>`:`<section class="card"><div class="tot big" style="border:0;margin:0;padding:0"><span>รวมวัตถุดิบหลัก</span><span>${fmt(c.main)}</span></div></section>`;
  return h;
}
function reviewV(){
  const d=cur(),c=calc(d),o=openOf(d),ex=+d.extra||0;
  return `<section class="card"><h2>📊 สรุปใบเบิกเงินสดย่อย</h2><div class="tot"><span>ยอดขายประจำวัน</span><b>${fmt(d.sales)}</b></div><div class="tot"><span>ยอดยกมา</span><span>${fmt(o)}</span></div><div class="tot"><span>เบิกเพิ่ม</span><span>${fmt(ex)}</span></div></section>
  <section class="card"><h2>รายการทั้งหมด</h2><div style="overflow-x:auto"><table class="tl"><tr><th>No</th><th>รายการ</th><th>บิล</th><th>มูลค่า</th><th>ชำระ</th><th>หมายเหตุ</th></tr>${d.items.map((x,i)=>`<tr><td>${i+1}</td><td>${x.t=='main'?'🥩 ':''}${esc(x.n)}</td><td>${x.t=='main'?'-':esc(x.b||'-')}</td><td>${x.v}</td><td>${x.t=='main'?'-':(x.p=='card'?'บัตร':'เงินสด')}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div></section>
  <section class="card"><h2>สรุปยอดรวม</h2><div class="tot"><span>เงินสด</span><span>${fmt(c.cash)}</span></div><div class="tot"><span>บัตร</span><span>${fmt(c.card)}</span></div><div class="tot"><span>รวมทั้งหมด</span><span>${fmt(c.cash+c.card)}</span></div><div class="tot"><span>วัตถุดิบหลัก</span><span>${fmt(c.main)}</span></div><div class="tot big"><span>คงเหลือเงินสด</span><span>${fmt(closeOf(d))}</span></div></section>
  <div class="row"><button class="s" onclick="review=false;render()">← กลับไปแก้ไข</button><button class="p" onclick="lock()">✓ ยืนยันบันทึก</button></div>`;
}
function bar(){
  const d=cur(),b=$('#bar');
  if(tab=='sum'||review||d.ok){b.hidden=true;return}
  b.hidden=false;b.innerHTML=`<div><small>${tab=='petty'?'คงเหลือเงินสด':'รวมวัตถุดิบหลัก'}</small><b>${fmt(tab=='petty'?closeOf(d):calc(d).main)}</b></div><button class="p" onclick="toReview()">ตรวจสอบและบันทึก ›</button>`;
}
function range(){return Object.values(docs).filter(d=>d.ok&&d.date>=from&&d.date<=to).sort((a,b)=>a.date<b.date?-1:1)}
const gpOf=(sales,c)=>{const g=(+sales||0)-c.cash-c.card-c.main;return{g,p:+sales>0?g/sales*100:null}};
const pc=n=>n==null?'-':(Math.round(n*10)/10).toLocaleString('th-TH',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const WD=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
function summary(){
  const R=range(),S=R.map(d=>({d,c:calc(d)})),tot=S.reduce((a,z)=>({s:a.s+ +z.d.sales,c:a.c+z.c.cash,k:a.k+z.c.card,m:a.m+z.c.main}),{s:0,c:0,k:0,m:0});
  const G=gpOf(tot.s,{cash:tot.c,card:tot.k,main:tot.m});
  const mx=Math.max(1,...S.map(z=>Math.max(+z.d.sales,z.c.cash+z.c.card+z.c.main))),H=130;
  let h=`<div class="card"><h2>📊 สรุปยอดขาย เทียบ เบิกจ่าย</h2><div class="row"><div><label>ตั้งแต่วันที่</label><input type="date" value="${from}" onchange="from=this.value;render()"></div><div><label>ถึงวันที่</label><input type="date" value="${to}" onchange="to=this.value;render()"></div></div>
  <div class="tot" style="margin-top:8px"><span>ยอดขายรวม</span><b>${fmt(tot.s)}</b></div><div class="tot"><span>เงินสด</span><span>${fmt(tot.c)}</span></div><div class="tot"><span>บัตร</span><span>${fmt(tot.k)}</span></div><div class="tot"><span>วัตถุดิบหลัก</span><span>${fmt(tot.m)}</span></div><div class="gp ${G.g<0?'neg':''}"><div><span>กำไรขั้นต้น</span><small style="color:var(--m)">ยอดขาย − เงินสด − บัตร − วัตถุดิบหลัก</small></div><div style="text-align:right"><b>${fmt(G.g)}</b><span>${pc(G.p)} ของยอดขาย</span></div></div></div>`;
  h+=`<div class="card"><h2>📈 กราฟรายวัน</h2><div class="lg"><span style="color:var(--g)">■ ยอดขาย</span><span style="color:var(--o)">■ เงินสด</span><span style="color:var(--bl)">■ บัตร</span><span style="color:var(--r)">■ วัตถุดิบหลัก</span></div><div class="bars">${S.map(z=>`<div class="day" title="${z.d.date}"><div style="height:${z.d.sales/mx*H}px;background:var(--g)"></div><div class="stk"><div style="height:${z.c.cash/mx*H}px;background:var(--o)"></div><div style="height:${z.c.card/mx*H}px;background:var(--bl)"></div><div style="height:${z.c.main/mx*H}px;background:var(--r)"></div></div></div>`).join('')||'<span style="color:var(--m)">ยังไม่มีใบที่ยืนยันบันทึก</span>'}</div></div>`;
  h+=`<div class="card"><h2>🧾 ใบเบิกที่บันทึกไว้</h2><p class="hint">เรียงจากล่าสุด · แตะที่ใบเพื่อเปิดดู</p>${S.length?S.slice().reverse().map(z=>{const g=gpOf(z.d.sales,z.c),dd=new Date(z.d.date+'T00:00:00');return `<div class="vl" onclick="go('${z.d.date}')"><div class="t"><b>${TH(z.d.date)}<small>${WD[dd.getDay()]}</small></b><span class="pct ${g.g<0?'neg':''}">กำไร ${pc(g.p)}</span></div><div class="sa"><span>ยอดขาย</span><span>${fmt(z.d.sales)}</span></div><dl><dt>เงินสด</dt><dd>${fmt(z.c.cash)}</dd><dt>บัตร</dt><dd>${fmt(z.c.card)}</dd><dt>วัตถุดิบหลัก</dt><dd>${fmt(z.c.main)}</dd><dt>คงเหลือเงินสด</dt><dd>${fmt(closeOf(z.d))}</dd></dl><div class="gl"><span>กำไรขั้นต้น</span><em class="${g.g<0?'neg':''}">${fmt(g.g)}</em></div></div>`}).join(''):'<div class="empty">ยังไม่มีใบที่ยืนยันบันทึก</div>'}</div>
  <div class="card"><h2>📁 รายงาน CSV</h2><button class="p" onclick="csv()">⬇️ ดาวน์โหลดรายงาน CSV</button><p style="font-size:12px;color:var(--m)">รวมเฉพาะใบที่ "ยืนยันบันทึก" แล้วในช่วงวันที่ข้างต้น</p></div>`;
  return h;
}

/* ===== การทำงาน ===== */
function setF(k,v){const d=cur();d[k]=v===''?(k=='open'?null:0):+v;persist(date);render()}
function toReview(){const d=cur();if(!d.items.length&&!d.sales){alert('ยังไม่มีข้อมูลให้บันทึก');return}review=true;render();scrollTo(0,0)}
function lock(){cur().ok=true;review=false;persist(date);render();scrollTo(0,0)}
function unlock(){cur().ok=false;persist(date);render()}
function go(dt){date=dt;tab='petty';review=false;render();scrollTo(0,0)}
function openSheet(k,edit){
  const d=cur();if(d.ok)return;const it=edit!=null?d.items[edit]:null;
  sh={edit:it?edit:null,p:it?(it.p||'cash'):'cash',b:it&&it.b=='ไม่มี'?'ไม่มี':'มี'};
  const nm=it?it.n:(k>=0?allN(tab)[k]:'');
  $('#sheet').innerHTML=`<div class="box"><h3>${it?'แก้ไขรายการ':'เพิ่มรายการ'}</h3><label>ชื่อรายการ</label><input id="s-n" value="${esc(nm)}" placeholder="พิมพ์ชื่อใหม่ได้เลย"><label>มูลค่า (บาท)</label><input id="s-v" class="xl" type="number" inputmode="decimal" placeholder="0" value="${it?it.v:''}">${tab=='petty'?`<label>ชำระ</label><div class="seg"><button id="p-cash" onclick="setP('cash')">💵 เงินสด</button><button id="p-card" onclick="setP('card')">💳 บัตร</button></div>`:''}${tab=='petty'?`<label>บิล</label><div class="seg"><button id="b-y" onclick="setB('มี')">🧾 มีบิล</button><button id="b-n" onclick="setB('ไม่มี')">ไม่มีบิล</button></div>`:''}<label>หมายเหตุ</label><input id="s-o" value="${esc(it?it.note:'')}"><div class="row" style="margin-top:14px"><button class="s" onclick="closeSheet()">ยกเลิก</button>${it?'<button class="d" onclick="delItem()">ลบ</button>':''}<button class="p" onclick="saveItem()">${it?'บันทึก':'เพิ่ม'}</button></div></div>`;
  $('#sheet').hidden=false;setP(sh.p);setB(sh.b);setTimeout(()=>$(nm?'#s-v':'#s-n').focus(),80);
}
function setP(p){sh.p=p;['cash','card'].forEach(k=>{const e=$('#p-'+k);if(e)e.classList.toggle('on',k==p)})}
function setB(v){sh.b=v;[['มี','y'],['ไม่มี','n']].forEach(([k,i])=>{const e=$('#b-'+i);if(e)e.classList.toggle('on',k==v)})}
function closeSheet(){$('#sheet').hidden=true;sh=null}
function saveItem(){
  const n=$('#s-n').value.trim(),v=+$('#s-v').value;if(!n||!(v>0)){alert('กรุณาใส่ชื่อรายการและมูลค่า');return}
  if(tab=='petty'&&!sh.b){alert('กรุณาเลือกว่ามีบิลหรือไม่มีบิล');return}
  const d=cur(),x={t:tab,n,b:tab=='petty'?sh.b:'',v,p:tab=='petty'?sh.p:'cash',note:$('#s-o').value.trim()};
  if(sh.edit!=null)d.items[sh.edit]=x;else d.items.push(x);
  if(!allN(tab).includes(n))names[tab].push(n);
  closeSheet();persist(date);render();
}
function delItem(){if(!confirm('ลบรายการนี้?'))return;cur().items.splice(sh.edit,1);closeSheet();persist(date);render()}
$('#sheet').onclick=e=>{if(e.target.id=='sheet')closeSheet()};
function csv(){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',L=[['วันที่','ยอดขาย','ลำดับ','รายการ','ประเภท','บิล','มูลค่า','ชำระ','หมายเหตุ'].map(q).join(',')];
  range().forEach(d=>d.items.forEach((x,i)=>L.push([d.date,d.sales||0,i+1,x.n,x.t=='main'?'วัตถุดิบหลัก':'เงินสดย่อย',x.b,x.v,x.t=='main'?'':(x.p=='card'?'บัตร':'เงินสด'),x.note].map(q).join(','))));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'}));a.download=`WL-Cash-${CONFIG.prefix}-${from}_${to}.csv`;a.click();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;review=false;render();scrollTo(0,0)});
$('#date').onchange=e=>{date=e.target.value||today();review=false;render()};

/* ===== รหัสผ่าน ===== */
let pv='';const dots=()=>$('#dots').textContent='●'.repeat(pv.length);
$('#branchP').textContent=CONFIG.branch;
'123456789C0⌫'.split('').forEach(k=>{const b=document.createElement('button');b.textContent=k=='C'?'ล้าง':k;b.style.fontSize=k=='C'?'15px':'';b.onclick=()=>{
  if(k=='C')pv='';else if(k=='⌫')pv=pv.slice(0,-1);else pv+=k;dots();
  if(pv==CONFIG.pin){sessionStorage.setItem(LK+'_in','1');$('#pin').remove()}else if(pv.length>=CONFIG.pin.length){pv='';dots();$('#dots').textContent='รหัสไม่ถูกต้อง'}};$('#kp').appendChild(b)});
if(sessionStorage.getItem(LK+'_in'))$('#pin').remove();
init();
</script></body></html>
